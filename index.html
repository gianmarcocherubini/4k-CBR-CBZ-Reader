<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' blob: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Opaque status bar (follows light/dark). With black-translucent, iPadOS shifts the web view of an
      installed app down by the status bar height and leaves an unused black band at the bottom.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mangadana" />
    <meta name="description" content="Mangadana: lettore di fumetti e manga (CBZ/CBR) ad alta risoluzione per iPad" />
    <!--
      Favicons: PNG and a classic ICO only. Safari picks a single candidate among the rel="icon" links
      and does not fall back when it cannot use it, so an SVG favicon here would leave the tab blank.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/mask-icon.svg" color="#26251e" />
    <title>Mangadana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
