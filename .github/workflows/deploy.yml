name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Reads the Pages configuration: base_path is "/<repo>" for the github.io project site and
      # empty once the custom domain (www.manga-dana.com) is set in Settings → Pages, so the same
      # workflow builds for either address. After changing the domain, run the workflow once.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build (base path from the Pages configuration)
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: End-to-end tests against the production build
        run: |
          npx playwright install --with-deps chromium
          npm run fixtures
          E2E_PREVIEW=1 npx playwright test --project=chromium
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
